//noinspection GlobalOptionInConsumerRules
plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}


android {
    namespace 'open.cn.awg.pro'
    buildFeatures { aidl true }
    compileSdk 35

    defaultConfig {
        applicationId 'open.cn.awg.pro'
        minSdk 24
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
        versionCode 2609010
        versionName '5.26.9'
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            debug {
                storeFile = file(keystoreProperties['release.store.file'] as String)
                storePassword = keystoreProperties['release.store.password'] as String
                keyAlias = keystoreProperties['release.key.alias'] as String
                keyPassword = keystoreProperties['release.key.password'] as String
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
            release {
                storeFile = file(keystoreProperties['release.store.file'] as String)
                storePassword = keystoreProperties['release.store.password'] as String
                keyAlias = keystoreProperties['release.key.alias'] as String
                keyPassword = keystoreProperties['release.key.password'] as String
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.debug
            }
        }
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // AGP 8.x syntax. Do not collapse jniLibs/resources into a single Groovy line:
    // `jniLibs { ... } resources { ... }` can be parsed as a chained call and cause:
    // Cannot invoke method resources() on null object.
    packaging {
        jniLibs {
            useLegacyPackaging false
            pickFirsts += [
                    '**/libijkffmpeg.so',
                    '**/libijkplayer.so',
                    '**/libijksdl.so',
                    '**/libtnet-3.1.14.so',
                    '**/libcrashsdk.so',
                    '**/libalicomphonenumberauthsdk_core.so',
                    '**/libpns-*.so',
                    '**/libpl_droidsonroids_gif.so'
            ]
        }
        resources {
            excludes += [
                    'META-INF/**',
                    'kotlin/**',
                    'DebugProbesKt.bin'
            ]
            pickFirsts += [
                    'okhttp3/internal/publicsuffix/publicsuffixes.gz'
            ]
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

def excludedLocalAars = [
        // xyz.doikki.videoplayer.ijk.aar already contains tv.danmaku.ijk.media.player.*.
        'tv.danmaku.ijk.media.player'
] as Set

def localAarNames = fileTree(dir: 'libs', include: ['*.aar']).files
        .collect { it.name.replaceFirst(/\.aar$/, '') }
        .findAll { !excludedLocalAars.contains(it) }
        .sort()

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    localAarNames.each { aarName ->
        implementation(name: aarName, ext: 'aar')
    }

    implementation 'com.squareup.okhttp3:okhttp:3.10.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'
}
